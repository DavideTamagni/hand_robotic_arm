# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.2
default_acceleration_scaling_factor: 0.2

# longest_valid_segment_fraction: 0.05

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  base_joint:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  rotating_forearm_joint:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  wrist_pitch_joint:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  wrist_yaw_joint:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  thumb_base_joint:
    has_velocity_limits: true
    min_position: -0.5520      # ADDED: Matches your new base limits
    max_position: 0.27      # ADDED: Matches your new base limits
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  thumb_joint:
    has_velocity_limits: true
    min_position: -0.13      # ADDED: Matches your new thumb range
    max_position: 0.5520      # ADDED: Matches your new thumb range
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 2.0  