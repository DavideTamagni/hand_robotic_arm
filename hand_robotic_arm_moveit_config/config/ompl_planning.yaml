planning_plugins:
  - ompl_interface/OMPLPlanner

# Profiles for the main mechanical arm positioning chain
arm_group:
  planner_configs:
    - RRTConnectkConfigDefault
    - PRMkConfigDefault
    - ESTkConfigDefault
  longest_valid_segment_fraction: 0.05
  projection_evaluator: joints(base_joint, shoulder_joint)

# Profiles for the standalone active hand joints
hand_group:
  planner_configs:
    - RRTConnectkConfigDefault
  longest_valid_segment_fraction: 0.05

# Core configuration setups for individual geometric solvers
planner_configs:
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0  # Max step size (0.0 defaults to automatic selection)
  PRMkConfigDefault:
    type: geometric::PRM
    max_nearest_neighbors: 10
  ESTkConfigDefault:
    type: geometric::EST
    goal_bias: 0.05
